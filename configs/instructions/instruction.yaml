model:
  name: "google/gemma-3-1b-pt" 

data:
  chat_dataset: "trl-lib/Capybara"
  sciq_path: /users/$USER/smiles-mid-training/data/instruction_tuning/sciq.jsonl
  metamathqa_path: /users/$USER/smiles-mid-training/data/instruction_tuning/metamathqa.jsonl

training:
  output_dir: "/iopsstor/scratch/cscs/$USER/instruction_tuning"
  epochs: 3             
  batch_size: 4         
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  warmup_steps: 50
  save_steps: 200
  logging_steps: 10
  bf16: true
  fp16: false
  seed: 42
  max_length: 2048

peft:
  use_lora: true 
  lora_r: 16             
  lora_alpha: 32         
  lora_dropout: 0.05
  lora_target_modules: 
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
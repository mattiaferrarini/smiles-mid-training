job:
  name: chemistry_baseline_training

model:
  name: google/gemma-3-4b-it

data:
  data_folder: /capstor/store/cscs/swissai/a131/ML4Science/datasets/CEMB_v1_HF_FineWeb-chemV1
  text_field: text

distributed:
  strategy: "ddp" # Options: "ddp" or "fsdp"
  ddp:
    find_unused_parameters: true
    backend: "nccl"
  fsdp:
    policy: "full_shard auto_wrap" 
    config:
      fsdp_transformer_layer_cls_to_wrap: "Gemma3DecoderLayer"

training:
  epochs: 1 
  gradient_accumulation_steps: 10 #8 for FSDP
  learning_rate: 2.0e-5
  warmup_steps: 50
  weight_decay: 0.0
  save_steps: 500
  logging_steps: 30
  bf16: true
  fp16: false
  evaluation_strategy: "no"
  save_strategy: "steps"
  seed: 42
  gradient_checkpointing: true
  num_workers: 64
  per_device_batch_size: 3 # 4 for FSDP
  max_length: 4096
  stride_size: 1024
  report_to: "wandb"

tokenizer:
  type: element

embeddings:
  strategy: mean_std

job:
  name: chemistry_baseline_training

model:
  name: google/gemma-3-4b-it

data:
  data_folder: /capstor/store/cscs/swissai/a131/ML4Science/datasets/CEMB_v1_HF_FineWeb-chemV1
  text_field: text_annotated_v1

training:
  epochs: 2 
  gradient_accumulation_steps: 10
  learning_rate: 2.0e-5
  warmup_steps: 100
  weight_decay: 0.0
  save_steps: 1000
  logging_steps: 1
  bf16: true
  fp16: false
  evaluation_strategy: "no"
  save_strategy: "steps"
  seed: 42
  gradient_checkpointing: true
  num_workers: 64
  per_device_batch_size: 3
  max_length: 4096
  stride_size: 1024
  report_to: "wandb"

tokenizer:
  type: element

embeddings:
  strategy: mean_std
